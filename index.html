<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logos/logo-concours.svg" />

    <meta name="theme-color" content="#532666" />

    <title>1er concours de trompette de Caluire-et-Cuire</title>
    <meta
      name="description"
      content="Toutes les informations sur le 1er concours de trompette de Caluire-et-Cuire, les 28 et 29 novembre 2026 : catégories, règlement, jury et inscription."
    />

    <!--
      Aperçu lors du partage du lien (réseaux sociaux, messageries).
      L'image est en URL absolue : Facebook, LinkedIn et les messageries ne
      résolvent pas les chemins relatifs. Elle est donc liée au domaine, seul
      endroit du projet où il est écrit en dur avec `og:url` ci-dessous — à
      reprendre ici tous les deux si le site passe un jour sous un
      sous-domaine de l'AMC2.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:title"
      content="1er concours de trompette de Caluire-et-Cuire"
    />
    <meta
      property="og:description"
      content="Les 28 et 29 novembre 2026 à Caluire-et-Cuire : catégories, règlement, jury et inscription."
    />
    <meta
      property="og:url"
      content="https://concours-trompette-caluire.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://concours-trompette-caluire.vercel.app/images/og-concours-trompette.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Logo du 1er concours de trompette de Caluire-et-Cuire, 28-29 novembre 2026"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
